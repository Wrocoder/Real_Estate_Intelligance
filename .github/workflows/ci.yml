name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish linux/arm64 OCI images to GHCR after CI passes."
        required: false
        default: false
        type: boolean
      next_public_api_base_url:
        description: "Frontend build-time public API URL, for example https://api.example.com."
        required: false
        default: ""
      next_public_site_url:
        description: "Frontend build-time public site URL, for example https://app.example.com."
        required: false
        default: ""
      next_public_owner_id:
        description: "Frontend build-time owner fallback."
        required: false
        default: "demo-user"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest with coverage
        run: python -m pytest --cov=domarion --cov-report=term-missing --cov-report=xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-xml
          path: coverage.xml

      - name: Performance smoke
        run: python scripts/performance_smoke.py --repeat 3

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://domarion:domarion@localhost:5432/domarion
        run: python -m alembic upgrade head --sql > /tmp/domarion-alembic.sql

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_OWNER_ID: demo-user
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend smoke
        run: npm run smoke

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t domarion-api:ci .

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000 \
            --build-arg NEXT_PUBLIC_OWNER_ID=demo-user \
            --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 \
            -t domarion-frontend:ci \
            ./frontend

  docker-publish:
    name: Publish OCI Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - docker-build
      - frontend
    if: >-
      (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.OCI_IMAGE_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_images == true)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare OCI image settings
        env:
          INPUT_NEXT_PUBLIC_API_BASE_URL: ${{ inputs.next_public_api_base_url || '' }}
          INPUT_NEXT_PUBLIC_SITE_URL: ${{ inputs.next_public_site_url || '' }}
          INPUT_NEXT_PUBLIC_OWNER_ID: ${{ inputs.next_public_owner_id || '' }}
          VAR_NEXT_PUBLIC_API_BASE_URL: ${{ vars.OCI_NEXT_PUBLIC_API_BASE_URL }}
          VAR_NEXT_PUBLIC_SITE_URL: ${{ vars.OCI_NEXT_PUBLIC_SITE_URL }}
          VAR_NEXT_PUBLIC_OWNER_ID: ${{ vars.OCI_NEXT_PUBLIC_OWNER_ID }}
        run: |
          set -euo pipefail

          api_base_url="${INPUT_NEXT_PUBLIC_API_BASE_URL:-$VAR_NEXT_PUBLIC_API_BASE_URL}"
          site_url="${INPUT_NEXT_PUBLIC_SITE_URL:-$VAR_NEXT_PUBLIC_SITE_URL}"
          owner_id="${INPUT_NEXT_PUBLIC_OWNER_ID:-$VAR_NEXT_PUBLIC_OWNER_ID}"
          owner_id="${owner_id:-demo-user}"

          if [[ -z "$api_base_url" || -z "$site_url" ]]; then
            echo "Set OCI_NEXT_PUBLIC_API_BASE_URL and OCI_NEXT_PUBLIC_SITE_URL." >&2
            exit 1
          fi

          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${GITHUB_SHA}"

          {
            echo "OCI_NEXT_PUBLIC_API_BASE_URL=$api_base_url"
            echo "OCI_NEXT_PUBLIC_SITE_URL=$site_url"
            echo "OCI_NEXT_PUBLIC_OWNER_ID=$owner_id"
            echo "OCI_IMAGE_TAG=$image_tag"
            echo "OCI_API_IMAGE=$image_namespace/domarion-api"
            echo "OCI_FRONTEND_IMAGE=$image_namespace/domarion-frontend"
            echo "OCI_POSTGIS_IMAGE=$image_namespace/domarion-postgis"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_API_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_API_IMAGE }}:latest-arm64

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.OCI_NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_OWNER_ID=${{ env.OCI_NEXT_PUBLIC_OWNER_ID }}
            NEXT_PUBLIC_SITE_URL=${{ env.OCI_NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.OCI_FRONTEND_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_FRONTEND_IMAGE }}:latest-arm64

      - name: Publish PostGIS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oracle/postgis.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_POSTGIS_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_POSTGIS_IMAGE }}:latest-arm64
