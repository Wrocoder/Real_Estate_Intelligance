name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish linux/arm64 OCI images to GHCR after CI passes."
        required: false
        default: false
        type: boolean
      deploy_oci:
        description: "Deploy the freshly published images to the protected OCI staging environment."
        required: false
        default: false
        type: boolean
      next_public_api_base_url:
        description: "Frontend build-time public API URL, for example https://api.example.com."
        required: false
        default: ""
      next_public_site_url:
        description: "Frontend build-time public site URL, for example https://app.example.com."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # Backend performance smoke exercises the deterministic in-memory fixture.
      DEMO_MODE_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest with coverage
        run: python -m pytest --cov=domarion --cov-report=term-missing --cov-report=xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-xml
          path: coverage.xml

      - name: Performance smoke
        run: python scripts/performance_smoke.py --repeat 3

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://domarion:domarion@localhost:5432/domarion
        run: python -m alembic upgrade head --sql > /tmp/domarion-alembic.sql

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      BROWSER_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend smoke
        run: npm run smoke

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

  browser-quality:
    name: Browser Quality
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      DEMO_MODE_ENABLED: "true"
      ENVIRONMENT: test
      DATA_REPOSITORY_BACKEND: memory
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start deterministic backend fixture
        run: |
          nohup python -m uvicorn domarion.main:app --host 127.0.0.1 --port 8000 > /tmp/domarion-backend.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          cat /tmp/domarion-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run start -- -p 3000 > /tmp/domarion-frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat /tmp/domarion-frontend.log
          exit 1

      - name: Run browser quality gate
        working-directory: frontend
        run: npm run browser:quality

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-quality-artifacts
          path: |
            frontend/artifacts/browser-quality
            /tmp/domarion-backend.log
            /tmp/domarion-frontend.log

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t domarion-api:ci .

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000 \
            --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 \
            -t domarion-frontend:ci \
            ./frontend

  docker-publish:
    name: Publish OCI Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - docker-build
      - frontend
    if: >-
      (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.OCI_IMAGE_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.publish_images == true || inputs.deploy_oci == true))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare OCI image settings
        env:
          INPUT_NEXT_PUBLIC_API_BASE_URL: ${{ inputs.next_public_api_base_url || '' }}
          INPUT_NEXT_PUBLIC_SITE_URL: ${{ inputs.next_public_site_url || '' }}
          VAR_NEXT_PUBLIC_API_BASE_URL: ${{ vars.OCI_NEXT_PUBLIC_API_BASE_URL }}
          VAR_NEXT_PUBLIC_SITE_URL: ${{ vars.OCI_NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail

          api_base_url="${INPUT_NEXT_PUBLIC_API_BASE_URL:-$VAR_NEXT_PUBLIC_API_BASE_URL}"
          site_url="${INPUT_NEXT_PUBLIC_SITE_URL:-$VAR_NEXT_PUBLIC_SITE_URL}"

          if [[ -z "$api_base_url" || -z "$site_url" ]]; then
            echo "Set OCI_NEXT_PUBLIC_API_BASE_URL and OCI_NEXT_PUBLIC_SITE_URL." >&2
            exit 1
          fi

          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${GITHUB_SHA}"

          {
            echo "OCI_NEXT_PUBLIC_API_BASE_URL=$api_base_url"
            echo "OCI_NEXT_PUBLIC_SITE_URL=$site_url"
            echo "OCI_IMAGE_TAG=$image_tag"
            echo "OCI_API_IMAGE=$image_namespace/domarion-api"
            echo "OCI_FRONTEND_IMAGE=$image_namespace/domarion-frontend"
            echo "OCI_POSTGIS_IMAGE=$image_namespace/domarion-postgis"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_API_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_API_IMAGE }}:latest-arm64

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.OCI_NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.OCI_NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.OCI_FRONTEND_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_FRONTEND_IMAGE }}:latest-arm64

      - name: Publish PostGIS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oracle/postgis.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_POSTGIS_IMAGE }}:${{ env.OCI_IMAGE_TAG }}
            ${{ env.OCI_POSTGIS_IMAGE }}:latest-arm64

  deploy-oci:
    name: Deploy OCI Staging
    runs-on: ubuntu-latest
    needs:
      - docker-publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_oci == true
    environment:
      name: oci-staging
    steps:
      - name: Prepare OCI deploy settings
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_PORT: ${{ vars.OCI_DEPLOY_PORT || '22' }}
          OCI_DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER || 'domarion' }}
        run: |
          set -euo pipefail

          test -n "$OCI_DEPLOY_HOST"
          test -n "$OCI_DEPLOY_PORT"
          test -n "$OCI_DEPLOY_USER"

          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${GITHUB_SHA}"

          {
            echo "OCI_DEPLOY_PORT=$OCI_DEPLOY_PORT"
            echo "OCI_DEPLOY_USER=$OCI_DEPLOY_USER"
            echo "OCI_IMAGE_TAG=$image_tag"
            echo "OCI_API_IMAGE=$image_namespace/domarion-api"
            echo "OCI_FRONTEND_IMAGE=$image_namespace/domarion-frontend"
            echo "OCI_POSTGIS_IMAGE=$image_namespace/domarion-postgis"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/oci_deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_ENV_FILE: ${{ secrets.OCI_ENV_FILE }}
          OCI_GHCR_READ_TOKEN: ${{ secrets.OCI_GHCR_READ_TOKEN }}
          OCI_GHCR_USERNAME: ${{ secrets.OCI_GHCR_USERNAME }}
        run: |
          set -euo pipefail

          test -n "$OCI_ENV_FILE"
          if [[ -n "$OCI_GHCR_READ_TOKEN" && -z "$OCI_GHCR_USERNAME" ]]; then
            echo "Set OCI_GHCR_USERNAME when OCI_GHCR_READ_TOKEN is configured." >&2
            exit 1
          fi

          ssh_target="${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}"
          ssh_common=(
            -i "$HOME/.ssh/oci_deploy_key"
            -p "$OCI_DEPLOY_PORT"
            -o IdentitiesOnly=yes
          )

          ssh "${ssh_common[@]}" "$ssh_target" \
            'set -eu;
             mkdir -p /srv/domarion/env/snapshots;
             if [ -f /srv/domarion/env/oracle.env ]; then
               cp /srv/domarion/env/oracle.env "/srv/domarion/env/snapshots/oracle.env.$(date -u +%Y%m%dT%H%M%SZ)";
             fi;
             chmod 700 /srv/domarion/env/snapshots'

          {
            printf '%s\n' "$OCI_ENV_FILE" | awk '!/^(API_IMAGE|FRONTEND_IMAGE|POSTGIS_IMAGE)=/'
            printf '\nAPI_IMAGE=%s:%s\n' "$OCI_API_IMAGE" "$OCI_IMAGE_TAG"
            printf 'FRONTEND_IMAGE=%s:%s\n' "$OCI_FRONTEND_IMAGE" "$OCI_IMAGE_TAG"
            printf 'POSTGIS_IMAGE=%s:%s\n' "$OCI_POSTGIS_IMAGE" "$OCI_IMAGE_TAG"
          } | ssh "${ssh_common[@]}" "$ssh_target" \
            'umask 077; cat > /srv/domarion/env/oracle.env'

          if [[ -n "$OCI_GHCR_READ_TOKEN" ]]; then
            printf '%s' "$OCI_GHCR_READ_TOKEN" | ssh "${ssh_common[@]}" "$ssh_target" \
              "docker login ghcr.io -u '$OCI_GHCR_USERNAME' --password-stdin"
          fi

          ssh "${ssh_common[@]}" "$ssh_target" \
            'cd /srv/domarion/app && scripts/deploy_oracle_cloud.sh --pull-images'
