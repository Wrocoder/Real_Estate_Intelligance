x-api-env: &api-env
  APP_NAME: ${APP_NAME:-WartoMetr API}
  ENVIRONMENT: ${ENVIRONMENT:-staging}
  DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-domarion}:${POSTGRES_PASSWORD:-domarion}@db:5432/${POSTGRES_DB:-domarion}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000","http://127.0.0.1:3000"]'}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATA_REPOSITORY_BACKEND: ${DATA_REPOSITORY_BACKEND:-postgres}
  REPORT_STORE_BACKEND: ${REPORT_STORE_BACKEND:-postgres}
  REPORT_ORDER_STORE_BACKEND: ${REPORT_ORDER_STORE_BACKEND:-postgres}
  USER_STORE_BACKEND: ${USER_STORE_BACKEND:-postgres}
  AUTH_STORE_BACKEND: ${AUTH_STORE_BACKEND:-postgres}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
  INGESTION_ADMIN_STORE_BACKEND: ${INGESTION_ADMIN_STORE_BACKEND:-postgres}
  USER_SUBMITTED_LISTING_STORE_BACKEND: ${USER_SUBMITTED_LISTING_STORE_BACKEND:-postgres}
  PARTNER_REFERRAL_STORE_BACKEND: ${PARTNER_REFERRAL_STORE_BACKEND:-postgres}
  AGENCY_STORE_BACKEND: ${AGENCY_STORE_BACKEND:-postgres}
  CRM_STORE_BACKEND: ${CRM_STORE_BACKEND:-postgres}
  AI_INSIGHT_STORE_BACKEND: ${AI_INSIGHT_STORE_BACKEND:-postgres}
  NEWS_STORE_BACKEND: ${NEWS_STORE_BACKEND:-postgres}
  CUSTOM_DASHBOARD_STORE_BACKEND: ${CUSTOM_DASHBOARD_STORE_BACKEND:-postgres}
  PRODUCT_ANALYTICS_STORE_BACKEND: ${PRODUCT_ANALYTICS_STORE_BACKEND:-postgres}
  REPORT_ARTIFACT_STORAGE_BACKEND: ${REPORT_ARTIFACT_STORAGE_BACKEND:-local}
  REPORT_ARTIFACT_LOCAL_DIR: ${REPORT_ARTIFACT_LOCAL_DIR:-/tmp/domarion/artifacts/reports}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:-}
  PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYU_SECOND_KEY: ${PAYU_SECOND_KEY:-}
  ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
  ALERT_EMAIL_SENDER: ${ALERT_EMAIL_SENDER:-alerts@wartometr.local}
  ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
  ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
  ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
  ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
  ALERT_SMTP_USE_TLS: ${ALERT_SMTP_USE_TLS:-true}
  ALERT_DELIVERY_TIMEOUT_SECONDS: ${ALERT_DELIVERY_TIMEOUT_SECONDS:-10}
  ALERT_TELEGRAM_ENABLED: ${ALERT_TELEGRAM_ENABLED:-false}
  ALERT_TELEGRAM_BOT_NAME: ${ALERT_TELEGRAM_BOT_NAME:-WartoMetrBot}
  ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
  ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
  ALERT_TELEGRAM_API_BASE_URL: ${ALERT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  WORKER_TASKS: ${WORKER_TASKS:-daily-email-alerts}
  WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-3600}
  WORKER_RUN_ONCE: ${WORKER_RUN_ONCE:-false}
  WORKER_APPLY: ${WORKER_APPLY:-false}
  WORKER_FORCE: ${WORKER_FORCE:-false}
  ALERT_WORKER_SEND: ${ALERT_WORKER_SEND:-false}
  ALERT_WORKER_MAX_MATCHES: ${ALERT_WORKER_MAX_MATCHES:-10}
  ALERT_WORKER_LIMIT: ${ALERT_WORKER_LIMIT:-500}
  MARKET_DATA_FEED_LOCATION: ${MARKET_DATA_FEED_LOCATION:-}
  MARKET_DATA_FEED_SOURCE_NAME: ${MARKET_DATA_FEED_SOURCE_NAME:-}
  MARKET_DATA_FEED_COMPLETE_SNAPSHOT: ${MARKET_DATA_FEED_COMPLETE_SNAPSHOT:-false}
  MARKET_DATA_FEED_MAX_LISTINGS: ${MARKET_DATA_FEED_MAX_LISTINGS:-10000}
  MARKET_DATA_FEED_TIMEOUT_SECONDS: ${MARKET_DATA_FEED_TIMEOUT_SECONDS:-20}
  RCN_TRANSACTIONS_LOCATION: ${RCN_TRANSACTIONS_LOCATION:-}
  RCN_TRANSACTIONS_SOURCE_NAME: ${RCN_TRANSACTIONS_SOURCE_NAME:-}
  RCN_TRANSACTIONS_MAX_ROWS: ${RCN_TRANSACTIONS_MAX_ROWS:-100000}
  RCN_TRANSACTIONS_MAX_PAGES: ${RCN_TRANSACTIONS_MAX_PAGES:-500}
  RCN_TRANSACTIONS_TIMEOUT_SECONDS: ${RCN_TRANSACTIONS_TIMEOUT_SECONDS:-30}
  RCN_TRANSACTIONS_INTERVAL_SECONDS: ${RCN_TRANSACTIONS_INTERVAL_SECONDS:-86400}
  RCN_DISTRICT_BOUNDARIES_LOCATION: ${RCN_DISTRICT_BOUNDARIES_LOCATION:-}
  RCN_DISTRICT_BOUNDARIES_SOURCE_NAME: ${RCN_DISTRICT_BOUNDARIES_SOURCE_NAME:-Wrocław Geoportal osiedle boundaries}
  RCN_DISTRICT_BOUNDARIES_SOURCE_URL: ${RCN_DISTRICT_BOUNDARIES_SOURCE_URL:-https://geoportal.wroclaw.pl/www/pliki/osiedla/granice-osiedli.zip}
  RCN_DISTRICT_BOUNDARIES_SOURCE_CRS: ${RCN_DISTRICT_BOUNDARIES_SOURCE_CRS:-2177}
  RCN_TRANSACTIONS_TELEGRAM_CHAT_ID: ${RCN_TRANSACTIONS_TELEGRAM_CHAT_ID:-}
  DEMO_USER_ID: ${DEMO_USER_ID:-demo-user}
  DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@domarion.local}

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domarion}
      POSTGRES_USER: ${POSTGRES_USER:-domarion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domarion}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domarion} -d ${POSTGRES_DB:-domarion}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - staging_redis_data:/data
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-env
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *api-env
      DEMO_MODE_ENABLED: "true"
    command: domarion seed-demo
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - demo

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-env
    volumes:
      - ${DOMARION_DATA_DIR:-.}/data:/srv/domarion/data:ro
    command:
      - domarion
      - worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  staging_postgres_data:
  staging_redis_data:
